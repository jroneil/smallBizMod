name: acme-reference

services:
  postgres:
    image: docker.io/library/postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${ACME_DB_NAME:-acme}
      POSTGRES_USER: ${ACME_DB_USER:-acme}
      POSTGRES_PASSWORD: ${ACME_DB_PASSWORD:-acme-local-development}
    volumes:
      - acme-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ../../..
      dockerfile: reference/acme/backend/Containerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${ACME_DB_NAME:-acme}
      SPRING_DATASOURCE_USERNAME: ${ACME_DB_USER:-acme}
      SPRING_DATASOURCE_PASSWORD: ${ACME_DB_PASSWORD:-acme-local-development}
      ACME_SECURITY_USERNAME: ${ACME_SECURITY_USERNAME:-acme}
      ACME_SECURITY_PASSWORD: ${ACME_SECURITY_PASSWORD:-acme-local-development}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ACME_BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ../../..
      dockerfile: reference/acme/frontend/Containerfile
      args:
        SBP_API_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "${ACME_FRONTEND_PORT:-3000}:3000"

volumes:
  acme-postgres-data:
